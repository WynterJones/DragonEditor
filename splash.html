<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DragonEditor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; border-radius: 16px; }
      img { width: 100%; height: 100%; object-fit: cover; display: block; animation: in 600ms ease-out; }
      @keyframes in { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body><img src="/brand/splash.png" alt="" /></body>
</html>
